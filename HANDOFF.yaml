metadata:
  project_name: "macropulse"
  display_name: "MacroPulse — Precision Nutrition & Automated Metabolic Engine"
  version: "2.3.0"
  description: >
    A full-stack, cloud-synchronized nutrition tracker and metabolic math engine.
    Features natural language AI meal parsing, Cramer's Rule 3x3 macro deficit balancing,
    USDA FoodData Central discovery, AWS Cognito authentication, and per-user Amazon
    DynamoDB synchronization.
  funding_budget: "$10,000 AWS Cloud Credits Active"

system_architecture:
  frontend:
    framework: "React 19.3.1 (TypeScript ~7.0.2)"
    bundler: "Vite 8.3.4 (with custom define and environment loaders)"
    styling: "Tailwind CSS v3.4.19 + PostCSS + Autoprefixer"
    icons: "Lucide React (v1.59.0)"
    linting: "Oxlint (v1.88.0)"
    build_output_directory: "dist"
  backend_and_cloud:
    architecture: "AWS Amplify Gen 2 (Code-First AWS CDK)"
    hosting_cdn: "Amazon CloudFront + AWS Amplify Hosting"
    authentication:
      service: "AWS Cognito User Pool"
      auth_mechanisms:
        - "Email + Password (with automated 6-digit confirmation codes)"
        - "Google OAuth (conditional activation via GOOGLE_CLIENT_ID & GOOGLE_CLIENT_SECRET)"
      session_management: "aws-amplify/auth (useAuthSession custom hook)"
    database:
      service: "Amazon DynamoDB (provisioned via Amplify Gen 2 defineData)"
      authorization_mode: "userPool (Cognito Owner-Based Row-Level Security: allow.owner())"
      models:
        - name: "UserProfile"
          fields: "sex, weightKg, heightCm, age, activity, goalDelta"
          security: "allow.owner()"
        - name: "DailyLog"
          fields: "date, weightKg, targetKcal, targetP, targetC, targetF, itemsJson, notes"
          security: "allow.owner()"
        - name: "CustomFood"
          fields: "name, category, p, c, f, defaultGrams"
          security: "allow.owner()"
    local_persistence:
      strategy: "Offline-First Dual Cache"
      storage_engine: "localStorage (mp_profile_v1, mp_history_v1, mp_foods, mp_gemini_key)"
      behavior: >
        Operates fully functional offline or in guest mode. When authenticated, automatically
        merges with and persists back to DynamoDB in the background.
  ai_and_nutrition_services:
    primary_ai_engine:
      provider: "Google Generative AI (Gemini REST API v1beta)"
      model_discovery_strategy: "Dynamic Runtime Discovery via GET /v1beta/models"
      preferred_model_tier: "Gemini 2.5 Flash -> Gemini 2.5 Pro -> Gemini 3.x Flash"
      capabilities:
        - "Natural language meal deconstruction into distinct food items"
        - "Realistic portion estimation in grams from household measures (eggs, slices, scoops, bowls, palms)"
        - "Brand recognition (Trader Joe's, Costco/Kirkland, Fairlife, Chipotle, etc.)"
        - "Exact macronutrient density calculation per 100g (P, C, F, Kcal)"
      voice_dictation: "Web Speech API (webkitSpeechRecognition) with live text-stream transcription"
    secondary_database_fallback:
      provider: "USDA FoodData Central API (api.nal.usda.gov/fdc/v1/foods/search)"
      purpose: "Official government nutritional facts lookup per 100g serving"

completed_milestones:
  - id: "M1_CORE_MATH_ENGINE"
    title: "Exact Metabolic Math & 3x3 Cramer's Rule Solver"
    file: "src/mathEngine.ts"
    summary: >
      Implemented Mifflin-St Jeor BMR & TDEE formulas, Atwater 4-4-9 calorie exact calculation,
      and a 3x3 linear matrix determinant solver (Cramer's Rule) to calculate the exact gram
      quantities of 3 user-selected anchor foods required to hit daily macro targets with zero error.

  - id: "M2_EXPANDED_FOOD_LIBRARY"
    title: "65+ Item Categorized Food Database"
    file: "src/foodDb.ts"
    summary: >
      Constructed an expanded built-in database covering Proteins, Seafood, Dairy & Eggs,
      Carbohydrates, Home-Cooked dishes, Produce, and Healthy Fats, with exact macronutrient
      densities per 100g and default serving sizes.

  - id: "M3_TREND_ANALYTICS"
    title: "Historical Trends & Rolling Metrics"
    file: "src/components/TrendCharts.tsx"
    summary: >
      Engineered custom SVG timeline graphs for weight trajectories, calorie deficit trends,
      macro breakdowns, and 7-day rolling adherence averages. Included JSON backup export/import
      and demo history generator.

  - id: "M4_AI_MEAL_LOGGER"
    title: "Natural Language Meal Parser & Speech Recognition"
    files:
      - "src/aiMealParser.ts"
      - "src/components/AIMealModal.tsx"
    summary: >
      Built a modal supporting freeform voice dictation and typed meal descriptions.
      Features interactive portion sliders, nutrient preview tags, and automatic food library
      expansion upon confirmation.

  - id: "M5_AWS_AMPLIFY_GEN2_MIGRATION"
    title: "AWS Backend Provisioning & Cognito Authentication"
    files:
      - "amplify/backend.ts"
      - "amplify/auth/resource.ts"
      - "amplify/data/resource.ts"
      - "src/auth.ts"
      - "src/components/AuthModal.tsx"
    summary: >
      Migrated application infrastructure to AWS Amplify Gen 2 to utilize $10,000 in AWS credits.
      Created Cognito User Pool with email verification codes and optional Google OAuth.
      Built responsive AuthModal supporting Sign In, Sign Up, Confirmation Codes, and Guest Mode.

  - id: "M6_DYNAMODB_CLOUD_SYNC"
    title: "Two-Way Cloud Data Synchronization"
    files:
      - "src/cloudSync.ts"
      - "src/App.tsx"
    summary: >
      Implemented automated two-way synchronization between client state and Amazon DynamoDB.
      Synchronizes user biometrics (UserProfile), daily meal logs (DailyLog), and custom foods
      (CustomFood) under owner-based row-level security. Added live cloud sync indicator to header.

  - id: "M7_DYNAMIC_AI_DISCOVERY"
    title: "Dynamic Model Discovery & Global Key Injection"
    files:
      - "vite.config.ts"
      - "amplify.yml"
      - "src/aiMealParser.ts"
      - "src/nutritionApi.ts"
    summary: >
      Bridged AWS Amplify container environment variables into Vite's build bundle.
      Replaced hardcoded deprecated Gemini model strings with dynamic GET /v1beta/models queries,
      eliminating 404 deprecation crashes and ensuring seamless global API key usage for all users.

resolved_technical_challenges:
  - issue: "npm Arborist Crash: Cannot read properties of null (reading 'edgesOut')"
    root_cause: >
      Stray package.json and package-lock.json files in the parent home directory (/Users/24adrianl)
      confused npm's Arborist resolver into constructing broken workspace trees.
    resolution: >
      Switched project package management to pnpm, removed corrupted local lockfiles,
      and isolated dependencies.

  - issue: "Corepack CI Crash: Cannot find module '.../pnpm/12.14.0/bin/pnpm.cjs'"
    root_cause: >
      AWS Amplify's build image uses an older Corepack version that looked for bin/pnpm.cjs,
      which was restructured in pnpm 12.
    resolution: >
      Bypassed Corepack in amplify.yml by running npm install -g pnpm@9, pinned pnpm@9.15.4
      in package.json, and added node-linker=hoisted to .npmrc.

  - issue: "Vite Environment Variable Blank in Production Bundle"
    root_cause: >
      Variables defined in AWS Amplify Hosting Console were kept in the container environment
      and not written to a .env file prior to vite build, causing import.meta.env to be empty.
    resolution: >
      Added 'env | grep -E "^(VITE_|GEMINI_)" >> .env || true' directly in amplify.yml before
      the build phase, and configured vite.config.ts to load both VITE_GEMINI_API_KEY and GEMINI_API_KEY.

  - issue: "Gemini 404 Error: models/gemini-2.0-flash is no longer available"
    root_cause: >
      Google retired gemini-2.0-flash from the public endpoint in favor of newer 2.5/3.x models,
      causing hardcoded model strings to fail.
    resolution: >
      Implemented getAvailableGeminiModels(apiKey) to dynamically query the official Google
      /v1beta/models endpoint, filter by supportedGenerationMethods: ["generateContent"],
      and prioritize active Flash models.

  - issue: "Silent Fallback Hijacking User Inputs with Canned Tomato Soup & Pickles"
    root_cause: >
      When the AI parser caught an error, it silently fell back to an offline USDA keyword search,
      matching 'tomatoes' and 'trader joes' to random canned products.
    resolution: >
      Decoupled AI errors from USDA heuristic search, ensuring explicit error messages are
      displayed and users have manual control over offline searches.

environment_configuration:
  required_variables:
    - name: "VITE_GEMINI_API_KEY"
      alternative_name: "GEMINI_API_KEY"
      location: "AWS Amplify Console -> App settings -> Environment variables"
      purpose: "Powers natural language meal parsing and USDA/AI nutrition discovery globally for all users."
      format: "AIzaSy..."
  optional_variables:
    - name: "GOOGLE_CLIENT_ID"
      location: "AWS Amplify Console -> App settings -> Environment variables"
      purpose: "Enables Google One-Click OAuth sign-in inside AWS Cognito User Pool."
    - name: "GOOGLE_CLIENT_SECRET"
      location: "AWS Amplify Console -> App settings -> Environment variables"
      purpose: "Google OAuth client secret corresponding to the Web Client ID."
  local_development:
    file: ".env.local"
    content_template: |
      VITE_GEMINI_API_KEY=your_gemini_api_key_here
      # Optional local OAuth credentials
      # GOOGLE_CLIENT_ID=
      # GOOGLE_CLIENT_SECRET=

