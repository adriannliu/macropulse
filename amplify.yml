version: 1
backend:
  phases:
    build:
      commands:
        - npm install -g pnpm@9
        - echo "node-linker=hoisted" >> .npmrc
        - pnpm install --no-frozen-lockfile
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - env | grep -E '^(VITE_|GEMINI_)' >> .env || true
        - pnpm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
